<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>stankin.help — навигатор</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">stankin.<span class="highlight">help</span></div>
            <p class="tagline">Навигатор по корпусам</p>
        </div>

        <!-- Три кнопки сверху (увеличенные) -->
        <div class="top-menu">
            <button class="menu-btn active" data-tab="navigator">🧭 Навигатор</button>
            <button class="menu-btn" data-tab="map">🗺️ Карта вуза</button>
            <button class="menu-btn" data-tab="schedule">📅 Расписание</button>
        </div>

        <!-- Блок навигатора -->
        <div id="navigatorTab" class="tab-content active">
            <div class="input-card">
                <div class="input-group">
                    <label>📍 Откуда</label>
                    <input type="text" id="from" list="auditories-list" placeholder="Введите номер аудитории" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>🎯 Куда</label>
                    <input type="text" id="to" list="auditories-list" placeholder="Введите номер аудитории" autocomplete="off">
                </div>
                <button id="findBtn">Построить маршрут →</button>
                <button id="resetBtn" style="background: #555; margin-top: 8px;">Сбросить маршрут</button>
            </div>

            <div id="result" class="result-card" style="display: none;">
                <h3>🗺️ Маршрут</h3>
                <div id="mapContainer" style="touch-action: pan-x pan-y;"></div>
            </div>
        </div>

        <!-- Блок карты вуза (заглушка) -->
        <div id="mapTab" class="tab-content" style="display: none;">
            <div class="info-card">
                <h3>🗺️ Общая карта вуза</h3>
                <p>Здесь будет карта всего кампуса (в разработке)</p>
            </div>
        </div>

        <!-- Блок расписания (заглушка) -->
        <div id="scheduleTab" class="tab-content" style="display: none;">
            <div class="info-card">
                <h3>📅 Расписание</h3>
                <p>Здесь будет расписание занятий (в разработке)</p>
            </div>
        </div>
    </div>

    <datalist id="auditories-list"></datalist>
    <script src="script.js"></script>
</body>
</html>
