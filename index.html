<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>stankin.help — навигатор</title>
    <script>
        const cssVersion = Date.now();
        document.write('<link rel="stylesheet" href="style.css?v=' + cssVersion + '">');
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0, s-maxage=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="-1">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">stankin.<span class="highlight">help</span></div>
            <p class="tagline">Коридорный навигатор</p>
        </div>

        <div class="input-card">
            <div class="input-group">
                <label>📍 Откуда</label>
                <input type="text" id="from" list="auditories-list" placeholder="0208" autocomplete="off">
            </div>
            <div class="input-group">
                <label>🎯 Куда</label>
                <input type="text" id="to" list="auditories-list" placeholder="0204" autocomplete="off">
            </div>
            <button id="findBtn">Построить маршрут →</button>
            <button id="resetBtn" style="background: #555; margin-top: 8px;">Сбросить маршрут</button>
        </div>

        <div id="result" class="result-card" style="display: none;">
            <h3>🗺️ Маршрут</h3>
            <div id="mapContainer"></div>
        </div>
    </div>

    <datalist id="auditories-list"></datalist>

    <script>
        const version = Date.now();
        document.write('<script src="script.js?v=' + version + '"><\/script>');
    </script>
</body>
</html>
