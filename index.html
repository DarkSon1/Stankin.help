<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>stankin.help — навигатор</title>
    <link rel="stylesheet" href="style.css">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">stankin.<span class="highlight">help</span></div>
            <p class="tagline">Коридорный навигатор</p>
        </div>

        <!-- ТРИ ВКЛАДКИ -->
        <div class="top-menu">
            <button class="menu-btn active" data-tab="nav">🧭 Навигация</button>
            <button class="menu-btn" data-tab="map">🗺️ Карта вуза</button>
            <button class="menu-btn" data-tab="schedule">📅 Расписание</button>
        </div>

        <!-- ВКЛАДКА НАВИГАЦИЯ -->
        <div id="navTab" class="tab-content active">
            <div class="input-card">
                <div class="input-group">
                    <label>📍 Откуда</label>
                    <input type="text" id="from" list="auditories-list" placeholder="Например: 0208" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>🎯 Куда</label>
                    <input type="text" id="to" list="auditories-list" placeholder="Например: ТП-8_ЛТТО_ЦТМ" autocomplete="off">
                </div>
                <button id="findBtn">Построить маршрут →</button>
                <button id="resetBtn" style="background: #555; margin-top: 8px;">Сбросить маршрут</button>
            </div>

            <div id="result" class="result-card" style="display: none;">
                <h3>🗺️ Маршрут</h3>
                <div id="mapContainer"></div>
            </div>
        </div>

        <!-- ВКЛАДКА КАРТА ВУЗА (ЗАГЛУШКА) -->
        <div id="mapTab" class="tab-content" style="display: none;">
            <div class="info-card">
                <h3>🗺️ Карта университета</h3>
                <p>Раздел в разработке. Скоро здесь появится карта всего кампуса.</p>
            </div>
        </div>

        <!-- ВКЛАДКА РАСПИСАНИЕ (ЗАГЛУШКА) -->
        <div id="scheduleTab" class="tab-content" style="display: none;">
            <div class="info-card">
                <h3>📅 Расписание</h3>
                <p>Раздел в разработке. Скоро здесь появится расписание занятий.</p>
            </div>
        </div>
    </div>

    <datalist id="auditories-list"></datalist>
    <script src="script.js"></script>
    <!-- Модальное окно выбора аудитории -->
    <div id="roomModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔍 Выберите аудиторию</h3>
                <span class="modal-close">&times;</span>
            </div>
            <div class="modal-body">
                <input type="text" id="modalSearch" placeholder="Введите номер аудитории..." autocomplete="off">
                <div id="modalRoomsList" class="modal-rooms-list"></div>
            </div>
        </div>
    </div>
</body>
</html>
